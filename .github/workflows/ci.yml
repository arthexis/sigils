name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository:
    name: Repository health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate repository structure
        run: python .ci/check_repo.py

  baseline:
    name: ci-base baseline
    uses: arthexis/ci-base/.github/workflows/consumer-ci.yml@v1
    with:
      python-version: "3.13"
      install-command: python -m pip install -e ".[all]"
      test-command: python -m pytest tests
      lint-paths: sigils tests .ci
      run-build: true
      run-install-check: true

  compatibility:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and optional tools
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -e ".[all]"
      - name: Run tests
        run: python -m pytest tests
      - name: Check installed dependencies
        run: python -m pip check
