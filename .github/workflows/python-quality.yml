name: Python Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: python / Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install CI tools
        run: python -m pip install --upgrade pip ruff
      - name: Install project
        run: python -m pip install -e '.[all]'
      - name: Ruff lint
        continue-on-error: true
        run: python -m ruff check --config pyproject.toml sigils tests .ci
      - name: Ruff format
        continue-on-error: true
        run: python -m ruff format --check --config pyproject.toml sigils tests .ci

# CI retrigger marker; no workflow behavior change.
