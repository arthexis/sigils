name: python / Python compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test tools
        run: python -m pip install --upgrade pip pytest && python -m pip install -e '.[all]'
      - name: Tests
        run: python -m pytest tests

  compatibility:
    name: Python compatibility
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all Python versions
        env:
          TEST_RESULT: ${{ needs.tests.result }}
        run: |
          if [[ "$TEST_RESULT" != "success" ]]; then
            echo "Python compatibility matrix result: $TEST_RESULT"
            exit 1
          fi
