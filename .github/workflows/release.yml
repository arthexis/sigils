name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish to PyPI
        required: true
        default: v0.4.2
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub release
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.meta.outputs.created }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "${TAG} already exists; nothing to release."
          else
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install release tooling
        if: steps.meta.outputs.created == 'true'
        run: python -m pip install --upgrade pip build twine
      - name: Build wheel and sdist
        if: steps.meta.outputs.created == 'true'
        run: python -m build
      - name: Validate distributions
        if: steps.meta.outputs.created == 'true'
        run: python -m twine check dist/*
      - name: Clean wheel install smoke test
        if: steps.meta.outputs.created == 'true'
        shell: bash
        run: |
          python -m venv /tmp/sigils-release-install
          /tmp/sigils-release-install/bin/python -m pip install --upgrade pip
          /tmp/sigils-release-install/bin/python -m pip install dist/*.whl
          /tmp/sigils-release-install/bin/python -m pip check
          /tmp/sigils-release-install/bin/python -c 'from sigils import Context, Secret, Sigil; assert Sigil("[x]").solve({"x": "ok"}) == "ok"; assert str(Secret("hidden")) == "[REDACTED]"'
      - name: Create version tag
        if: steps.meta.outputs.created == 'true'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$HEAD_SHA" -m "Sigils $TAG"
          git push origin "$TAG"
      - name: Create GitHub release
        if: steps.meta.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: >-
          gh release create "$TAG" dist/*
          --target "$HEAD_SHA"
          --title "$TAG"
          --generate-notes

  pypi:
    name: Publish to PyPI
    needs: release
    if: >-
      always() &&
      (
        (github.event_name == 'workflow_run' &&
         needs.release.result == 'success' &&
         needs.release.outputs.created == 'true') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/gway-sigils
    steps:
      - name: Resolve publish tag
        id: meta
        shell: bash
        env:
          MANUAL_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$MANUAL_TAG"
          else
            TAG="$RELEASE_TAG"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.meta.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Verify tag matches package version
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$TAG" = "v${VERSION}"
      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: ${{ github.event_name == 'workflow_dispatch' }}
