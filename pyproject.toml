[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gway-sigils"
version = "0.4.3"
description = "Solve templates with [sigils]."
readme = "README.rst"
requires-python = ">=3.11"
license = "LicenseRef-ARTHEXIS"
license-files = ["LICENSE"]
keywords = ["utils", "sigils", "string", "text", "meta-text", "context", "template"]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Markup",
    "Topic :: Software Development :: Pre-processors",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[[project.authors]]
name = "Rafael Jesús Guillén Osorio"
email = "arthexis@gmail.com"

[project.optional-dependencies]
dotenv = ["dotenv-python"]
yaml = ["pyyaml"]
markdown = ["markdown"]
astronomy = ["ephem"]
build = ["build"]
all = [
    "dotenv-python",
    "pyyaml",
    "markdown",
    "ephem",
    "build",
]

[project.urls]
Source = "https://github.com/arthexis/sigils"
Bug-Tracker = "https://github.com/arthexis/sigils/issues"

[project.scripts]
sigils = "sigils.__main__:main"

[tool.setuptools.packages.find]
include = ["sigils*"]
exclude = ["samples*", "tests*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
